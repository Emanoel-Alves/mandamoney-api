openapi: 3.1.0
info:
  title: Manda Money API
  version: 1.0.0
  description: Versioned API contract replacing the Google Apps Script endpoints.
servers:
  - url: https://api.example.invalid/api/v1
    description: Replace with the deployed API origin.
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Sign in with the existing phone-and-birthday credentials
      description: Verifies the legacy phone-and-birthday pair using its keyed verifier and returns an opaque revocable session. Login is rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, birthday]
              properties:
                phone:
                  type: string
                  minLength: 10
                  maxLength: 20
                  description: Phone number normalized to digits by the server.
                birthday:
                  type: string
                  pattern: '^\d{2}/\d{2}/\d{4}$'
      responses:
        "200":
          description: Authenticated user and opaque access token.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresAt, user]
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/me:
    get:
      summary: Return the authenticated user's identity
      responses:
        "200":
          description: Authenticated user identity.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      summary: Revoke the current API session
      responses:
        "200": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /bootstrap:
    get:
      summary: Load initial screen data in one request
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        "200":
          description: Initial user, current-month items, balances, and notification counts.
          content:
            application/json:
              schema:
                type: object
                required: [user, items, balances, notifications]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  itemsNextCursor: { type: [string, "null"] }
                  balances:
                    type: array
                    items: { $ref: "#/components/schemas/Balance" }
                  notifications:
                    type: object
                    properties:
                      paymentRequests: { type: integer, minimum: 0 }
                      disputes: { type: integer, minimum: 0 }
  /items:
    get:
      summary: List items in a date range using cursor pagination
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Complete household item page, visible to any authenticated member of this single-household deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
  /items/batch:
    post:
      summary: Save an item batch and its resulting balance links
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/NewItem" }
      responses:
        "201": { description: Items and balance links created. }
        "400": { $ref: "#/components/responses/BadRequest" }
  /categories:
    get:
      security: []
      summary: List available item categories
      responses:
        "200":
          description: Categories stored in the database.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
    post:
      summary: Create a category for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: Created category or existing normalized category.
          content:
            application/json:
              schema:
                type: object
                required: [category]
                properties:
                  category: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /balances:
    get:
      summary: List balances for the authenticated user
      responses:
        "200":
          description: Balances involving the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances:
                    type: array
                    items: { $ref: "#/components/schemas/Balance" }
  /household/users:
    get:
      summary: List members of the single household
      responses:
        "200":
          description: Registered members of the single household.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
  /disputes:
    get:
      summary: List all disputes involving the authenticated user
      responses:
        "200":
          description: Dispute history involving the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [disputes]
                properties:
                  disputes:
                    type: array
                    items: { $ref: "#/components/schemas/Dispute" }
  /balances/{balanceId}/items:
    get:
      summary: Read items and adjustment history for a balance
      parameters:
        - $ref: "#/components/parameters/BalanceId"
      responses:
        "200":
          description: Associated item shares and immutable balance offsets.
          content:
            application/json:
              schema:
                type: object
                required: [items, adjustments]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BalanceItem" }
                  disputes:
                    type: array
                    items: { $ref: "#/components/schemas/Dispute" }
                  adjustments:
                    type: array
                    items: { $ref: "#/components/schemas/BalanceAdjustment" }
        "404": { $ref: "#/components/responses/NotFound" }
  /balances/{balanceId}/payment-requests:
    post:
      summary: Request payment for a pending balance
      parameters:
        - $ref: "#/components/parameters/BalanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          { description: Payment request created for creditor confirmation. }
        "409": { $ref: "#/components/responses/Conflict" }
  /payment-requests/{requestId}/confirm:
    post:
      summary: Confirm a payment request as its creditor
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Payment confirmed and balance settled. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /balances/{balanceId}/disputes:
    post:
      summary: Dispute an item share on a pending balance
      parameters:
        - $ref: "#/components/parameters/BalanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
      responses:
        "201": { description: Dispute submitted to the creditor. }
        "409": { $ref: "#/components/responses/Conflict" }
  /disputes/{disputeId}/resolve:
    post:
      summary: Accept or reject a dispute as the creditor
      parameters:
        - in: path
          name: disputeId
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, rejected] }
      responses:
        "200": { description: Dispute resolved. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /balances/{balanceId}/offset:
    post:
      summary: Offset reciprocal pending balances atomically
      parameters:
        - $ref: "#/components/parameters/BalanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reciprocal balances reduced and immutable adjustment recorded.
          content:
            application/json:
              schema:
                type: object
                required: [adjustment, balances]
                properties:
                  adjustment: { $ref: "#/components/schemas/BalanceAdjustment" }
                  balances:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items: { $ref: "#/components/schemas/Balance" }
        "409": { $ref: "#/components/responses/Conflict" }
  /notifications:
    get:
      summary: List pending payment and dispute notifications
      responses:
        "200":
          description: Pending notifications for the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [paymentRequests, disputes]
                properties:
                  paymentRequests:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentRequest" }
                  disputes:
                    type: array
                    items: { $ref: "#/components/schemas/Dispute" }
  /imports/nfce/qr:
    post:
      summary: Look up a Ceará NFC-e QR code directly with SEFAZ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrCode]
              properties:
                qrCode: { type: string, maxLength: 4096 }
      responses:
        "200": { description: Parsed receipt data. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /imports/receipt/ocr:
    post:
      summary: Extract items from a receipt image through the configured OCR provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageBase64, mimeType]
              properties:
                imageBase64: { type: string, minLength: 4, maxLength: 700000 }
                mimeType:
                  { type: string, enum: [image/jpeg, image/png, image/webp] }
      responses:
        "200": { description: Parsed receipt data. }
  /health/live:
    get:
      security: []
      summary: Process liveness check
      responses:
        "200": { description: Process is running. }
  /health/ready:
    get:
      security: []
      summary: Database readiness check
      responses:
        "200": { description: Database is reachable. }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    BalanceId:
      in: path
      name: balanceId
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    Category:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    User:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Item:
      allOf:
        - $ref: "#/components/schemas/NewItem"
        - type: object
          required: [id]
          properties:
            id: { type: string }
            buyerName: { type: string }
            value: { type: number, minimum: 0 }
    NewItem:
      type: object
      required:
        [date, market, product, valueCents, participantIds, paidDirectlyBy]
      properties:
        date: { type: string, format: date }
        market: { type: string, maxLength: 200 }
        product: { type: string, minLength: 1, maxLength: 300 }
        category: { type: string, maxLength: 100 }
        valueCents: { type: integer, minimum: 1 }
        buyerId:
          {
            type: string,
            description: If supplied,
            must match the authenticated user's ID.,
          }
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        paidDirectlyBy:
          type: array
          uniqueItems: true
          items: { type: string }
    ItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextCursor: { type: [string, "null"] }
    Balance:
      type: object
      required: [id, debtorId, creditorId, amountCents, status]
      properties:
        id: { type: string }
        debtorId: { type: string }
        creditorId: { type: string }
        amountCents: { type: integer, minimum: 0 }
        status:
          type: string
          enum:
            [
              pending,
              awaiting_confirmation,
              contest_pending,
              paid,
              contested,
              offset,
            ]
        paidAt: { type: [string, "null"], format: date-time }
    BalanceItem:
      type: object
      required: [itemId, shareCents]
      properties:
        itemId: { type: string }
        shareCents: { type: integer, minimum: 0 }
        value: { type: number, minimum: 0 }
        product: { type: string }
        date: { type: string }
        market: { type: string }
    BalanceAdjustment:
      type: object
      required: [id, balanceIds, amountCents, createdAt]
      properties:
        id: { type: string }
        balanceIds:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
        amountCents: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    PaymentRequest:
      type: object
      required:
        [id, balanceId, debtorId, creditorId, amountCents, status, requestedAt]
      properties:
        id: { type: string }
        balanceId: { type: string }
        debtorId: { type: string }
        creditorId: { type: string }
        amountCents: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, confirmed, rejected] }
        requestedAt: { type: string, format: date-time }
    Dispute:
      type: object
      required: [id, balanceId, itemId, amountCents, status, requestedAt]
      properties:
        id: { type: string }
        balanceId: { type: string }
        itemId: { type: string }
        amountCents: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, accepted, rejected] }
        requestedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated user is not permitted to perform this operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Resource state conflicts with requested operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Database or dependent service unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: SEFAZ or OCR provider returned an invalid response or is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GatewayTimeout:
      description: SEFAZ or OCR provider did not respond in time.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
